org.gradle.jvmargs=-Xmx4096m --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# CORREÇÃO: o auto-migrador do Flutter (>=3.44) reescreve
# android/app/build.gradle a cada "flutter run"/build, sempre trocando
# um "minSdk = 23" explícito de volta para
# "minSdkVersion = flutter.minSdkVersion" — em vez de brigar com ele
# (e arriscar isso quebrar de novo em qualquer clone novo do repo, já
# que o android/local.properties com esse mesmo override NÃO é
# versionado), sobrescrevemos o PRÓPRIO flutter.minSdkVersion aqui
# (arquivo versionado, que o auto-migrador nunca reescreve). 23 é
# exigido pelo flutter_secure_storage (dependência transitiva do
# flutter_facebook_auth, ver pubspec.yaml/social_auth_service.dart) —
# sem isso o merge do AndroidManifest falha.
flutter.minSdkVersion=23
