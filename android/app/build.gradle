plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.security_check_app"
    // Fixado em 36 (em vez de flutter.compileSdkVersion) — 35 atendia o
    // requisito mínimo do plugin audioplayers, mas o flutter_secure_storage
    // (dependência transitiva do flutter_facebook_auth, ver
    // social_auth_service.dart) pede 36.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion


    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.security_check_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // Fixado em 23 (em vez de flutter.minSdkVersion, que resolvia 21)
        // — exigido pelo flutter_secure_storage (dependência transitiva do
        // flutter_facebook_auth, ver pubspec.yaml/social_auth_service.dart):
        // a lib usa APIs indisponíveis abaixo do Android 6.0 (API 23) e o
        // merge do manifest falha sem isso. Único efeito colateral: o app
        // deixa de instalar em Android 5.0/5.1 (API 21-22).
        minSdk = 23
        // Fixado em 35 para acompanhar o compileSdk acima.
        targetSdk = 35

        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

// Mesmo helper usado internamente pelo plugin firebase_core (ver
// firebase_core/android/build.gradle) para resolver a versão do Firebase
// BOM configurada pelo tooling do FlutterFire — replicado aqui em vez de
// fixar uma versão manualmente, para a dependência abaixo (necessária ao
// SolicitacaoMonitoramentoFcmReceiver, que usa RemoteMessage diretamente)
// nunca ficar dessincronizada da versão que o resto do app já usa.
def getRootProjectExtOrDefaultProperty(name) {
    if (!rootProject.ext.has("FlutterFire")) return project.properties[name]
    if (!rootProject.ext.get("FlutterFire")[name]) return project.properties[name]
    return rootProject.ext.get("FlutterFire").get(name)
}

dependencies {
    // Necessária para NotificationCompat.Builder usado pelo VolumeSosService
    // (Foreground Service persistente do gatilho físico de SOS).
    implementation "androidx.core:core-ktx:1.13.1"
    // Required for PreferenceManager
    implementation "androidx.preference:preference-ktx:1.2.1"

    // Necessária para RemoteMessage em SolicitacaoMonitoramentoFcmReceiver
    // (interceptação nativa do broadcast do FCM, ver essa classe).
    implementation platform("com.google.firebase:firebase-bom:${getRootProjectExtOrDefaultProperty("FirebaseSDKVersion")}")
    implementation "com.google.firebase:firebase-messaging"
}

flutter {
    source = "../.."
}
