name: security_check_app
description: A security check application for personal safety.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Firebase (to be configured later)
  # firebase_core: ^2.24.0
  # firebase_auth: ^4.16.0
  # cloud_firestore: ^4.14.0

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Networking & GPS
  http: ^1.1.2
  geolocator: ^10.1.0

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true