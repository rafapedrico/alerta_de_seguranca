name: security_check_app
description: A security check application for personal safety.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Internacionalização (i18n/l10n) - Português/Inglês/Espanhol
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Firebase / Login Social (Google e Facebook) — a configurar quando
  # houver um projeto Firebase real (google-services.json) e as
  # credenciais do Facebook Developer (App ID + Client Token). Até lá,
  # os botões de login social em login_screen.dart chamam
  # FirebaseAuthService, que apenas simula o login (mesmo padrão mock já
  # usado no login/cadastro por e-mail). Para ativar de verdade:
  # 1. Rodar `flutterfire configure` (gera google-services.json e
  #    firebase_options.dart) ou adicionar o google-services.json manualmente.
  # 2. Descomentar as linhas abaixo.
  # 3. Substituir os corpos mockados de FirebaseAuthService pelas chamadas
  #    reais (Firebase.initializeApp, GoogleSignIn, FacebookAuth, etc).
  # firebase_core: ^2.24.0
  # firebase_auth: ^4.16.0
  # cloud_firestore: ^4.14.0
  # google_sign_in: ^6.2.1
  # flutter_facebook_auth: ^6.2.1

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Networking & GPS
  http: ^1.1.2
  geolocator: ^10.1.0
  dio: ^5.7.0

  # UI
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.3.3

  # Contatos e permissões (Contatos de Emergência - aba Família)
  flutter_contacts: ^1.1.9+2
  permission_handler: ^11.3.1
  url_launcher: ^6.2.5

  # Alarmes em segundo plano e notificações locais
  android_alarm_manager_plus: ^4.0.3
  flutter_local_notifications: ^19.5.0

  # Alerta Sonoro Customizável (Etapa 1 - Expansão Global)
  audioplayers: ^6.1.0

  # Recurso de Captura e Dissuasão: câmera traseira em tela cheia
  # Fixado em 0.10.5+9 (em vez de 0.11.x) para evitar a dependência
  # transitiva camera_android_camerax mais recente, que exige uma API
  # SurfaceProducer.Callback incompatível com a versão do Flutter/Gradle
  # local usada neste projeto.
  camera: 0.10.5+9



dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/sounds/
    - assets/lang/
    - assets/images/


