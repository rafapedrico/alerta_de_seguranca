name: security_check_app
description: A security check application for personal safety.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Internacionalização (i18n/l10n) - Português/Inglês/Espanhol
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Firebase — projeto real "guardiaox" já configurado (ver
  # android/app/google-services.json). firebase_auth ativado (login/cadastro
  # reais por e-mail/senha, ver lib/services/firebase_auth_service.dart);
  # login social (Google/Facebook) permanece mockado por enquanto.
  # firebase_messaging ativado para o Push App-para-App de alerta híbrido
  # (ver lib/services/fcm_service.dart) e cloud_functions para as chamadas
  # callable (ex: confirmação de compra de créditos da Carteira).
  firebase_core: ^2.32.0
  cloud_firestore: ^4.17.5
  firebase_auth: ^4.16.0
  firebase_messaging: ^14.9.4
  cloud_functions: ^4.7.6
  # google_sign_in: ^6.2.1
  # flutter_facebook_auth: ^6.2.1

  # Compras consumíveis (recarga da Carteira em USD) — Google Play apenas,
  # não há projeto iOS neste repositório.
  in_app_purchase: ^3.2.0

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Networking & GPS
  http: ^1.1.2
  geolocator: ^10.1.0
  dio: ^5.7.0

  # UI
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.3.3

  # Contatos e permissões (Contatos de Emergência - aba Família)
  flutter_contacts: ^1.1.9+2
  permission_handler: ^11.3.1
  url_launcher: ^6.2.5

  # Alarmes em segundo plano e notificações locais
  android_alarm_manager_plus: ^4.0.3
  flutter_local_notifications: ^19.5.0

  # Alerta Sonoro Customizável (Etapa 1 - Expansão Global)
  audioplayers: ^6.1.0

  # Recurso de Captura e Dissuasão: câmera traseira em tela cheia
  # Fixado em 0.10.5+9 (em vez de 0.11.x) para evitar a dependência
  # transitiva camera_android_camerax mais recente, que exige uma API
  # SurfaceProducer.Callback incompatível com a versão do Flutter/Gradle
  # local usada neste projeto.
  camera: 0.10.5+9
  phone_numbers_parser: ^9.0.25
  firebase_storage: ^11.7.7
  gal: 2.1.3
  share_plus: ^10.0.0
  path_provider: ^2.1.5



dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/sounds/
    - assets/lang/
    - assets/images/


